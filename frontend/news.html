<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뉴스 | VAP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Pretendard', 'system-ui', 'sans-serif'],
      display: ['Outfit', 'Pretendard', 'sans-serif'],
    } } } }
  </script>
</head>
<body class="bg-white text-zinc-900 antialiased selection:bg-emerald-200">

  <div id="app-header"></div>

  <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-zinc-500 hover:text-zinc-800">
      <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> 홈
    </a>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-zinc-900">뉴스</h1>
    <p class="mt-2 text-zinc-600">카테고리별 최신 뉴스를 보거나, 키워드로 검색해보세요.</p>

    <div class="mt-8 relative">
      <iconify-icon icon="solar:magnifer-linear" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></iconify-icon>
      <input id="searchInput" type="text" placeholder="키워드로 검색 (예: 청문회)"
        class="w-full rounded-2xl border border-zinc-200 bg-zinc-50 pl-11 pr-4 py-4 text-base text-zinc-900 outline-none focus:border-emerald-400 focus:bg-white">
    </div>

    <div id="categoryTabs" class="mt-6 flex flex-wrap gap-2"></div>

    <div id="newsStatus" class="mt-8"></div>
    <div id="newsList" class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </section>

  <div id="app-footer"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/news.js"></script>
</body>
</html>
