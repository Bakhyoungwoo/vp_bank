<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 시장 브리핑 | VAP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Pretendard', 'system-ui', 'sans-serif'],
      display: ['Outfit', 'Pretendard', 'sans-serif'],
    } } } }
  </script>
</head>
<body class="bg-white text-zinc-900 antialiased selection:bg-emerald-200">

  <div id="app-header"></div>

  <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
    <a href="market.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-zinc-500 hover:text-zinc-800">
      <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> 증시
    </a>
    <div class="mt-4 flex items-start justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-zinc-900">AI 시장 브리핑</h1>
        <p class="mt-2 text-zinc-600">오늘의 시황을 AI가 요약해드려요.</p>
      </div>
      <button id="regenerateBtn" type="button" class="cta-magnetic shrink-0 inline-flex items-center gap-2 rounded-xl border border-zinc-200 px-4 py-2.5 text-sm font-semibold text-zinc-600 hover:bg-zinc-50">
        <iconify-icon icon="solar:refresh-linear"></iconify-icon> 다시 생성
      </button>
    </div>

    <div id="briefingCard" class="mt-8"></div>

    <div class="mt-10">
      <h2 class="text-lg font-bold text-zinc-900 mb-4">오늘의 급등락 종목</h2>
      <div id="moversList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>
  </section>

  <div id="app-footer"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/stock-mock.js"></script>
  <script src="assets/js/market-briefing.js"></script>
</body>
</html>
