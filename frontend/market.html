<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>증시 | VAP</title>
  <meta name="description" content="주요 지수, 종목 검색·비교, AI 시장 분석을 한곳에서 확인하세요.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: {
        sans: ['Pretendard', 'system-ui', 'sans-serif'],
        display: ['Outfit', 'Pretendard', 'sans-serif'],
      } } },
    }
  </script>
</head>
<body class="bg-white text-zinc-900 antialiased selection:bg-emerald-200">

  <div id="app-header"></div>

  <section class="border-b border-zinc-100 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14 md:py-20">
      <span class="inline-flex items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 pulse-dot"></span>
        MARKET
      </span>
      <h1 class="keep-all mt-4 text-3xl md:text-4xl font-bold tracking-tight text-zinc-900">증시</h1>
      <p class="mt-3 text-zinc-600">주요 지수부터 종목 검색·비교, AI 분석까지 한 곳에서 확인하세요.</p>

      <div class="mt-8 flex items-center justify-between">
        <span id="marketUpdatedAt" class="text-xs text-zinc-400">시세를 불러오는 중…</span>
        <button id="refreshMarketBtn" type="button" class="inline-flex items-center gap-2 rounded-xl border border-zinc-200 px-4 py-2.5 text-sm font-semibold text-zinc-600 hover:bg-zinc-50">
          <iconify-icon icon="solar:refresh-linear"></iconify-icon> 새로고침
        </button>
      </div>
      <div id="indexGrid" class="mt-4 grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="col-span-2 lg:col-span-4 rounded-2xl bg-zinc-50 p-8 text-center text-sm text-zinc-400">시세를 불러오는 중…</div>
      </div>

      <div class="mt-8 rounded-3xl border border-zinc-200 bg-white p-5 md:p-7">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold tracking-tight text-zinc-900">시장 흐름</h2>
            <p id="marketChartStatus" class="mt-1 text-xs text-zinc-400">차트 데이터를 불러오는 중…</p>
          </div>
          <select id="marketChartSelect" class="rounded-xl border border-zinc-200 bg-white px-3 py-2 text-sm font-semibold text-zinc-700 outline-none focus:border-emerald-400">
            <option value="^KS11">코스피</option>
            <option value="^KQ11">코스닥</option>
            <option value="^IXIC">나스닥</option>
            <option value="^GSPC">S&amp;P500</option>
            <option value="AAPL">애플 (AAPL)</option>
          </select>
        </div>
        <div class="relative mt-5 h-72">
          <canvas id="marketChart"></canvas>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ FEATURE MENU ============ -->
  <section class="border-b border-zinc-100 bg-zinc-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
      <h2 class="text-xl font-bold tracking-tight text-zinc-900 mb-6">증시 도구</h2>
      <div id="featureMenu" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
  </section>

  <!-- ============ POPULAR STOCKS ============ -->
  <section class="border-b border-zinc-100 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
      <div class="flex items-end justify-between gap-4 mb-6">
        <div>
          <h2 class="text-xl font-bold tracking-tight text-zinc-900">인기 종목</h2>
          <p class="mt-1 text-sm text-zinc-500">종목을 눌러 상세 정보를 확인해보세요.</p>
        </div>
        <a href="stock-search.html" class="text-sm font-semibold text-emerald-600 hover:text-emerald-700">종목 검색 →</a>
      </div>
      <div id="popularStocks" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
  </section>

  <!-- ============ MARKET NEWS ============ -->
  <section class="bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
      <div class="flex items-end justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold tracking-tight text-zinc-900">증시 관련 뉴스</h2>
          <p class="mt-2 text-sm text-zinc-500">수집된 경제 분야 최신 기사입니다.</p>
        </div>
        <a href="index.html#recommend" class="text-sm font-semibold text-emerald-600 hover:text-emerald-700">추천 뉴스 전체 보기 →</a>
      </div>
      <div id="marketNewsList" class="mt-6 divide-y divide-zinc-100 rounded-2xl border border-zinc-200 bg-white">
        <div class="p-8 text-center text-sm text-zinc-400">뉴스를 불러오는 중…</div>
      </div>
    </div>
  </section>

  <div id="app-footer"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/stock-mock.js"></script>
  <script src="assets/js/market.js"></script>
</body>
</html>
