<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종목 검색 | VAP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Pretendard', 'system-ui', 'sans-serif'],
      display: ['Outfit', 'Pretendard', 'sans-serif'],
    } } } }
  </script>
</head>
<body class="bg-white text-zinc-900 antialiased selection:bg-emerald-200">

  <div id="app-header"></div>

  <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
    <a href="market.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-zinc-500 hover:text-zinc-800">
      <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> 증시
    </a>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-zinc-900">종목 검색</h1>
    <p class="mt-2 text-zinc-600">종목명 또는 코드로 검색해보세요.</p>

    <div class="mt-8 relative">
      <iconify-icon icon="solar:magnifer-linear" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></iconify-icon>
      <input id="searchInput" type="text" placeholder="예: 삼성전자, AAPL"
        class="w-full rounded-2xl border border-zinc-200 bg-zinc-50 pl-11 pr-4 py-4 text-base text-zinc-900 outline-none focus:border-emerald-400 focus:bg-white">
    </div>

    <div id="historyWrap" class="mt-4 hidden">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-zinc-400">최근 검색어</span>
        <button id="clearHistoryBtn" type="button" class="text-xs text-zinc-400 hover:text-red-500">전체 삭제</button>
      </div>
      <div id="historyChips" class="mt-2 flex flex-wrap gap-2"></div>
    </div>

    <div id="searchResults" class="mt-8 space-y-2"></div>
  </section>

  <div id="app-footer"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/stock-mock.js"></script>
  <script src="assets/js/stock-search.js"></script>
</body>
</html>
