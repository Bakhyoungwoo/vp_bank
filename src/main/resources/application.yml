spring:
  datasource:
    # 개발 환경에서는 환경변수를 우선 사용하고, 없으면 로컬 MySQL(3307)을 사용합니다.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/vapdb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:vap}
    password: ${SPRING_DATASOURCE_PASSWORD:vap123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis 설정
  data:
    redis:
      # 운영 환경에서는 서비스 이름 redis를 사용합니다.
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: 6379
      database: 0

  kafka:
    # 운영 환경에서는 kafka:9092를 사용합니다.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: user-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  docker:
    compose:
      enabled: false

# 로깅 설정
logging:
  level:
    root: INFO
    com.example.vap_back: DEBUG

jwt:
  secret: ${JWT_SECRET:dev-local-secret-key-change-in-production}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,null}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
