name: VAP Service CI/CD

on:
  push:
    branches: ["master"]

jobs:
  build-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Build backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vap-backend:latest

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vap-python:latest

  deploy:
    needs: [build-spring, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Kubernetes manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "infra/k8s/*"
          target: "/home/${{ secrets.SERVER_USER }}/vap-k8s/"
          strip_components: 2
      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/vap-k8s
            sed -i "s/YOUR_DOCKERHUB_USERNAME/${{ secrets.DOCKER_USERNAME }}/g" backend.yaml ai.yaml
            sed -i "s/RDS_ENDPOINT/${{ secrets.RDS_ENDPOINT }}/g" configmap.yaml
            test -f .env.production
            kubectl create secret generic vap-secrets -n vap --from-env-file=.env.production --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -k .
            kubectl rollout restart deployment/backend deployment/ai -n vap
            kubectl rollout status deployment/backend -n vap --timeout=180s
            kubectl rollout status deployment/ai -n vap --timeout=180s
