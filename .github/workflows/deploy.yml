name: VAP Service CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  # Spring Boot Build & Push
  build-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Spring Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vap-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/vap-backend:${{ github.sha }}

  # Python Build & Push
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Python Image
        uses: docker/build-push-action@v6
        with:
          # 중요: Python 코드가 있는 하위 폴더 지정
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vap-python:latest
            ${{ secrets.DOCKER_USERNAME }}/vap-python:${{ github.sha }}

  # Job 3: Deploy to Server
  deploy:
    needs: [build-spring, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Resolve production security group
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS account: $ACCOUNT_ID"
          SG_ID=$(aws ec2 describe-security-groups \
            --region ap-northeast-2 \
            --filters Name=tag:Name,Values=vap-production-terraform \
            --query 'SecurityGroups[0].GroupId' \
            --output text)
          test -n "$SG_ID" && test "$SG_ID" != "None" || {
            echo "Tagged production security group was not found in account $ACCOUNT_ID"
            exit 1
          }
          echo "EC2_SECURITY_GROUP_ID=$SG_ID" >> "$GITHUB_ENV"

      # GitHub Actions 러너의 공인 IP만 SSH(22)에 임시로 허용 (배포 종료 후 always()로 제거)
      - name: Allow runner IP for SSH
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      # 설정 파일(compose-prod.yaml, nginx 설정, 배포 스크립트) 서버로 전송
      - name: Copy Deploy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "infra/compose-prod.yaml,infra/nginx/**,infra/scripts/deploy-blue-green.sh"
          target: "/home/${{ secrets.SERVER_USER }}/"
          strip_components: 1

      # 최초 배포 서버라 Docker가 없을 수 있으므로, 없을 때만 설치한다 (멱등적).
      - name: Ensure Docker is installed
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi
            sudo systemctl enable --now docker

      # 서버 접속 후 blue-green 배포 스크립트 실행 (비활성 슬롯만 갱신 → 헬스체크 →
      # 트래픽 전환 → 5xx 비율 관찰 → 초과 시 자동 롤백)
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}

            test -f .env
            chmod +x scripts/deploy-blue-green.sh
            ./scripts/deploy-blue-green.sh

            docker image prune -f

      - name: Revoke runner IP from SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" || true
