name: VAP Service CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  # Spring Boot Build & Push
  build-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Spring Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./infra/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vap-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/vap-backend:${{ github.sha }}

  # Python Build & Push
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Python Image
        uses: docker/build-push-action@v4
        with:
          # 중요: Python 코드가 있는 하위 폴더 지정
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vap-python:latest

  # Job 3: Deploy to Server
  deploy:
    needs: [build-spring, build-python]
    runs-on: ubuntu-latest
    steps:
      # 설정 파일(compose-prod.yaml, nginx 설정, 배포 스크립트) 서버로 전송
      - name: Copy Deploy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "infra/compose-prod.yaml,infra/nginx/**,infra/scripts/deploy-blue-green.sh"
          target: "/home/${{ secrets.SERVER_USER }}/"
          strip_components: 1

      # 서버 접속 후 blue-green 배포 스크립트 실행 (비활성 슬롯만 갱신 → 헬스체크 →
      # 트래픽 전환 → 5xx 비율 관찰 → 초과 시 자동 롤백)
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            docker pull ${{ secrets.DOCKER_USERNAME }}/vap-python:latest
            docker compose -f compose-prod.yaml up -d ai

            chmod +x deploy-blue-green.sh
            ./deploy-blue-green.sh

            docker image prune -f