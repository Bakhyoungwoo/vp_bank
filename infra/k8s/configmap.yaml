apiVersion: v1
kind: ConfigMap
metadata:
  name: vap-config
  namespace: vap
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://RDS_ENDPOINT:3306/vapdb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
  SPRING_DATASOURCE_USERNAME: vap
  SPRING_REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  AI_BASE_URL: http://ai:8000
  SPRING_HOST: backend
  REDIS_HOST: redis
  ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
