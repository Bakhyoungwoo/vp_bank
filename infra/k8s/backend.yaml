apiVersion: v1
kind: Service
metadata: { name: backend, namespace: vap }
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: vap }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: docker.io/YOUR_DOCKERHUB_USERNAME/vap-backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: vap-config }
            - secretRef: { name: vap-secrets }
          env:
            - { name: TZ, value: Asia/Seoul }
          resources:
            requests: { cpu: 200m, memory: 320Mi }
            limits: { cpu: 500m, memory: 640Mi }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 20 }
