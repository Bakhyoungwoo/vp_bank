worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        # ai 서비스가 SPRING_HOST:8080으로 콜백을 보내므로 8080도 같이 받는다.
        listen 8080;

        # Docker Compose 임베디드 DNS. $active를 변수로 써서 proxy_pass하려면
        # (재기동 없이 대상을 바꾸려면) resolver가 반드시 필요하다.
        resolver 127.0.0.11 valid=10s;

        # active.conf가 $active 값을 backend-blue 또는 backend-green으로 지정한다.
        # 배포 스크립트가 이 파일만 고쳐 쓰고 `nginx -s reload`하면 무중단으로 트래픽이 전환된다.
        include /etc/nginx/conf.d/active.conf;

        location / {
            proxy_pass http://$active:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
