

version: "3.9"

networks:
  vap-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: vap-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vapdb}
      MYSQL_USER: ${MYSQL_USER:-vap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vap-network

  redis:
    image: redis:7
    container_name: vap-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vap-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vap-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - vap-network

  ai:
    image: ${DOCKER_USERNAME}/vap-python:${IMAGE_TAG:-latest}
    container_name: vap-ai
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # backend는 blue/green 두 슬롯으로 나뉘어 고정 호스트명이 없으므로,
      # 활성 슬롯으로 트래픽을 넘겨주는 nginx를 통해 콜백을 보낸다.
      SPRING_HOST: nginx
    ports:
      - "8000:8000"
    networks:
      - vap-network

  # blue/green 두 슬롯. 항상 둘 다 떠 있고, nginx가 그 중 하나에만 트래픽을 흘려보낸다.
  # 배포 스크립트(scripts/deploy-blue-green.sh)가 비활성 슬롯만 갱신한 뒤 트래픽을 전환한다.
  backend-blue:
    image: ${DOCKER_USERNAME}/vap-backend:${IMAGE_TAG:-latest}
    container_name: vap-backend-blue
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai:
        condition: service_started
    env_file:
      - .env
    environment:
      AI_BASE_URL: http://ai:8000
    networks:
      - vap-network

  backend-green:
    image: ${DOCKER_USERNAME}/vap-backend:${IMAGE_TAG:-latest}
    container_name: vap-backend-green
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai:
        condition: service_started
    env_file:
      - .env
    environment:
      AI_BASE_URL: http://ai:8000
    networks:
      - vap-network

  nginx:
    image: nginx:1.27-alpine
    container_name: vap-nginx
    depends_on:
      - backend-blue
      - backend-green
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      - vap-network


volumes:
  mysql_data:
